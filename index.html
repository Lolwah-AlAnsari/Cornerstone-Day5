<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SĀLFA — Every cup has a story</title>
<meta name="description" content="SĀLFA is a personal gahwa log. Record what you had, where, who with, and the story behind every cup." />
<meta name="theme-color" content="#FBF7F1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/salfa.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232E1F1A'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23B08D57'/%3E%3C/svg%3E" />
</head>
<body>

<a class="skip-link" href="#view">Skip to content</a>

<header class="topbar" id="topbar">
  <div class="shell topbar__inner">
    <a class="brand" href="#/" data-nav>
      <span class="brand__dot" aria-hidden="true"></span>
      <span class="brand__word">SĀLFA</span>
    </a>

    <nav class="topbar__actions" aria-label="Main">
      <button class="langswitch" id="langBtn" type="button" aria-live="polite"></button>
      <span class="topbar__auth" id="topbarAuth"></span>
    </nav>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<footer class="footer">
  <div class="shell footer__inner">
    <span class="footer__mark">SĀLFA — سالفة</span>
    <span class="footer__tag" id="footerTag"></span>
  </div>
</footer>

<!-- Detail sheet: a dialog on desktop, a bottom sheet on mobile -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close-sheet></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetPanel"></div>
</div>

<div class="toaster" id="toaster" aria-live="polite" aria-atomic="false"></div>

<script src="./js/config.js"></script>
<script type="module" src="./js/app.js"></script>

<noscript>
  <div class="shell" style="padding:4rem 0">
    <h1>SĀLFA</h1>
    <p>SĀLFA needs JavaScript enabled to load your gahwa log.</p>
  </div>
</noscript>

</body>
</html>
